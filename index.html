<html lang="vi">

<style>
  :root{
    --forest:#1f3b2f; --forest2:#2c5346; --sand:#efe9da; --sand2:#f8f5ec;
    --gold:#b9925a; --gold-dim:#cbab7c; --ink:#26332c; --muted:#6b7a70;
    --line:#dcd3bd; --teal:#3d6d63; --clay:#8a4b3f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--sand);color:var(--ink);height:100%;
    font-family:'Work Sans',-apple-system,sans-serif;}
  h1,h2,.serif{font-family:'Cormorant Garamond',serif;}

  .app{display:flex;flex-direction:column;min-height:100vh;}
  @media (min-width:900px){
    .app{flex-direction:row;height:100vh;}
    .sidebar{width:378px;min-width:378px;height:100vh;overflow-y:auto;border-right:1px solid var(--line);border-bottom:none;}
    .mapwrap{flex:1;height:100vh;}
  }
  .sidebar{background:var(--sand2);display:flex;flex-direction:column;}

  header{padding:22px 24px 16px;position:relative;}
  header h1{font-size:23px;font-weight:600;margin:0 0 6px;color:var(--forest);letter-spacing:.2px;}
  header p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;max-width:290px;}
  .rule{height:1px;background:linear-gradient(to right, var(--gold), transparent);margin:14px 0 0;}

  .langswitch{position:absolute;top:22px;right:22px;display:flex;border:1px solid var(--line);
    border-radius:999px;overflow:hidden;background:#fff;}
  .langswitch button{border:none;background:transparent;padding:6px 12px;font-size:11.5px;
    letter-spacing:.06em;font-weight:600;cursor:pointer;color:var(--muted);}
  .langswitch button.active{background:var(--forest);color:var(--sand2);}

  .panel{padding:18px 24px;border-top:1px solid var(--line);}
  .panel + .panel{padding-top:16px;}
  .label-sm{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600;}

  .modeswitch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
    background:#fff;margin-bottom:12px;}
  .modeswitch button{flex:1;border:none;background:transparent;padding:9px 6px;font-size:12px;
    font-weight:600;cursor:pointer;color:var(--muted);}
  .modeswitch button.active.real{background:var(--teal);color:#fff;}
  .modeswitch button.active.virtual{background:var(--clay);color:#fff;}

  .modeswitch.admin4{border-radius:12px;flex-wrap:wrap;}
  .modeswitch.admin4 button{flex:1 1 45%;padding:9px 4px;font-size:11px;border-bottom:1px solid var(--line);}
  .modeswitch.admin4 button.active{background:var(--gold);color:#fff;}

  .row{display:flex;gap:10px;margin-bottom:10px;}
  .field{flex:1;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--muted);}
  select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    background:#fff;font-size:13.5px;color:var(--ink);font-family:inherit;}
  .swapbtn{align-self:flex-end;border:1px solid var(--line);background:#fff;border-radius:8px;
    width:38px;height:38px;font-size:15px;cursor:pointer;flex:none;color:var(--forest);}

  .gpsbtn{width:100%;padding:11px;border:1px solid var(--teal);border-radius:9px;background:#fff;
    color:var(--teal);font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:9px;letter-spacing:.02em;}
  .gpsbtn.tracking{background:var(--teal);color:#fff;}
  .go{width:100%;padding:12px;border:none;border-radius:9px;background:var(--forest);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.03em;}
  .go:active,.gpsbtn:active{opacity:.85}

  .result{font-size:12.5px;color:var(--ink);margin-top:12px;min-height:16px;line-height:1.6;}
  .result b{color:var(--gold);font-weight:600;}
  .gpsnote{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;}
  .virtualhint{font-size:11px;color:var(--clay);margin-top:7px;line-height:1.5;display:none;}

  .hint{font-size:10.5px;color:var(--muted);padding:14px 24px 4px;line-height:1.5;}
  footer{padding:8px 24px 20px;font-size:10px;color:var(--muted);line-height:1.5;opacity:.8;}

  .adminToggle{margin:4px 24px 18px;font-size:10.5px;color:var(--muted);background:none;border:none;
    cursor:pointer;text-decoration:underline;padding:0;text-align:left;display:none;}
  .adminPanel{display:none;padding:16px 24px 20px;border-top:1px dashed var(--line);background:#fbf8f0;}
  .adminPanel.open{display:block;}
  .adminBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .adminBtns button{flex:1;min-width:110px;padding:8px 6px;font-size:11px;border-radius:7px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
  .adminBtns button.danger{border-color:var(--clay);color:var(--clay);}
  .adminBtns button.danger:hover{background:var(--clay);color:#fff;}
  .adminNote{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
  textarea.codeOut{width:100%;height:130px;margin-top:8px;font-family:monospace;font-size:10px;
    border:1px solid var(--line);border-radius:6px;padding:8px;}

  .mapwrap{position:relative;width:100%;overflow:auto;background:radial-gradient(ellipse at center, #16281f 0%, #0e1c15 100%);
    -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;}
  .mapinner{position:relative;transform-origin:top left;}
  .mapinner.pickmode{cursor:crosshair;}
  .mapinner.drawmode{cursor:copy;}
  .mapinner.movemode{cursor:grab;}
  .mapinner img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
  svg.overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

  .node{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;

  .node.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .node.endpoint{background:var(--forest);border-color:var(--forest);color:var(--sand2);width:28px;height:28px;font-size:11px;}
  .node.selected{background:var(--clay);border-color:var(--clay);color:#fff;}

  .junction{position:absolute;transform:translate(-50%,-50%);width:13px;height:13px;

  .junction.selected{background:var(--clay);border-style:solid;}

  .gpsdot{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;

  .zoomctrl button{width:32px;height:32px;border:none;border-radius:8px;background:var(--sand2);
    color:var(--forest);font-size:16px;font-weight:600;cursor:pointer;}
  .zoomctrl button:hover{background:var(--gold);color:#fff;}

let lang = "vi";
let mode = "real";
const isAdmin = new URLSearchParams(location.search).get("admin") === "1";

/* ============ 1. Điểm có tên (POI) — cố định, có nhãn VI/EN ============ */
const NODES = {
  entrance:  {vi:"Lối vào",               en:"Entrance",                x:93.4, y:13.3},
  parking:   {vi:"Bãi đỗ xe",             en:"Parking",                 x:80.8, y:9.6},

  eastwing:  {vi:"Tòa Đông",              en:"East Wing",               x:65.4, y:22.8},
  westwing:  {vi:"Tòa Tây",               en:"West Wing",               x:43.1, y:22.8},
  splash:    {vi:"10. Splashing Hub",     en:"10. Splashing Hub",       x:40.0, y:34.0},

};

/* ============ 2. Sơ đồ đường đi (khung đồ thị) do quản trị tự vẽ ============
   JUNCTIONS: điểm nối tự do không tên, do công cụ tạo ra khi vẽ chuỗi — {id:{x,y}}
   NODE_OVERRIDES: vị trí đã chỉnh lại cho 1 điểm có tên (nếu có kéo/di chuyển) — {id:{x,y}}
   GRAPH_EDGES: danh sách liên kết [idA, idB] — idA/idB có thể là điểm có tên hoặc điểm nối tự do
   Dán đè cả 3 biến này bằng đoạn mã xuất ra từ nút "Xuất mã" để publish cho mọi khách. */
const JUNCTIONS = {};
const NODE_OVERRIDES = {};
const GRAPH_EDGES = [];

/* 1 đơn vị bản đồ (hệ tọa độ % chuẩn hóa 0-1000) ứng với bao nhiêu mét thật.
   Chỉnh DUY NHẤT con số này nếu quãng đường hiển thị chưa đúng tỉ lệ thực tế. */
const METERS_PER_UNIT = 0.9;

function vertexPos(id){
  if(JUNCTIONS[id]) return JUNCTIONS[id];
  if(NODE_OVERRIDES[id]) return NODE_OVERRIDES[id];
  return NODES[id];
}
function isPOI(id){ return !!NODES[id]; }
function vertexLabel(id){ return isPOI(id) ? NODES[id][lang] : null; }
function edgeLen(a,b){ const A=vertexPos(a), B=vertexPos(b); return Math.hypot(A.x-B.x, A.y-B.y); }

let graph = {};
function rebuildGraph(){
  graph = {};
  const ids = new Set([...Object.keys(NODES), ...Object.keys(JUNCTIONS)]);
  ids.forEach(id => graph[id] = []);
  GRAPH_EDGES.forEach(([a,b])=>{
    if(!graph[a] || !graph[b]) return;
    const meters = Math.round(edgeLen(a,b) * METERS_PER_UNIT);
    graph[a].push({to:b,w:meters});
    graph[b].push({to:a,w:meters});
  });
}

/* ============ 3. Dijkstra ============ */
function shortestPath(start,end){
  const dist = {}, prev = {};
  Object.keys(graph).forEach(id=> dist[id] = Infinity);
  dist[start] = 0;
  const queue = new Set(Object.keys(graph));
  while(queue.size){
    let u = null, best = Infinity;
    queue.forEach(id=>{ if(dist[id] < best){ best = dist[id]; u = id; } });
    if(u === null) break;
    queue.delete(u);
    if(u === end) break;
    graph[u].forEach(({to,w})=>{
      const alt = dist[u] + w;
      if(alt < dist[to]){ dist[to] = alt; prev[to] = u; }
    });
  }
  if(dist[end] === Infinity) return null;
  const path = [end];
  let cur = end;
  while(cur !== start){ cur = prev[cur]; path.unshift(cur); }
  return {path, distance: dist[end]};
}

/* ============ 4. GPS calibration (⚠️ số giả — xem README) ============ */
const GPS_CALIBRATION = {
  anchor1: { lat: 15.97000, lng: 108.25000, nodeId: "entrance" },
  anchor2: { lat: 15.96850, lng: 108.24870, nodeId: "beach" },
};
function gpsToXY(lat, lng){
  const a1 = GPS_CALIBRATION.anchor1, a2 = GPS_CALIBRATION.anchor2;
  const n1 = vertexPos(a1.nodeId), n2 = vertexPos(a2.nodeId);
  const tx = (lng - a1.lng) / (a2.lng - a1.lng);
  const ty = (lat - a1.lat) / (a2.lat - a1.lat);
  return { x: n1.x + tx * (n2.x - n1.x), y: n1.y + ty * (n2.y - n1.y) };
}
function nearestPOI(x, y){
  let best = null, bestD = Infinity;
  Object.keys(NODES).forEach(id=>{
    const p = vertexPos(id);
    const d = Math.hypot(p.x - x, p.y - y);
    if(d < bestD){ bestD = d; best = id; }
  });
  return best;
}
function isOnMap(x,y){ return x > -25 && x < 125 && y > -25 && y < 125; }

/* ============ 5. UI refs ============ */
const fromSel = document.getElementById("fromSel");
const toSel = document.getElementById("toSel");
const overlay = document.getElementById("overlay");
const mapwrap = document.getElementById("mapwrap");
const mapinner = document.getElementById("mapinner");
const mapimg = document.getElementById("mapimg");
const resultEl = document.getElementById("result");
const gpsNoteEl = document.getElementById("gpsNote");
const gpsBtn = document.getElementById("gpsBtn");
const virtualHintEl = document.getElementById("virtualHint");
const adminPanel = document.getElementById("adminPanel");
const adminNoteEl = document.getElementById("adminNote");
const codeOut = document.getElementById("codeOut");
let lastRoute = null, gpsDotEl = null, watchId = null, liveTracking = false;

function toVX(x){ return x/100*1000; }
function toVY(y){ return y/100*1000; }

function buildOptions(sel, value){
  sel.innerHTML = "";
  Object.entries(NODES).forEach(([id,n])=>{
    const o = document.createElement("option"); o.value=id; o.textContent=n[lang]; sel.appendChild(o);
  });
  if(value) sel.value = value;
}

const poiDotEls = {};
Object.keys(NODES).forEach(id=>{
  const dot = document.createElement("div");
  dot.className = "node"; dot.id = "dot-"+id;
  const p = vertexPos(id);
  dot.style.left = p.x+"%"; dot.style.top = p.y+"%";
  dot.addEventListener("click", (e)=>{
    if(adminMode){ return; } // để mapinner xử lý theo chế độ quản trị đang bật
    e.stopPropagation();
    if(!window._picking || window._picking === "from"){ fromSel.value = id; window._picking = "to"; }
    else { toSel.value = id; window._picking = "from"; }
    render(); if(lastRoute) runRoute();
  });
  mapinner.appendChild(dot);
  poiDotEls[id] = dot;
});

function clearOverlay(){ overlay.innerHTML = ""; }
function svgLine(x1,y1,x2,y2,stroke,width,dash){
  const l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1",x1); l.setAttribute("y1",y1); l.setAttribute("x2",x2); l.setAttribute("y2",y2);
  l.setAttribute("stroke",stroke); l.setAttribute("stroke-width",width);
  l.setAttribute("stroke-linecap","round");
  if(dash) l.setAttribute("stroke-dasharray",dash);
  overlay.appendChild(l);
}
function drawBaseNetwork(){
  GRAPH_EDGES.forEach(([a,b])=>{
    const A=vertexPos(a), B=vertexPos(b);
    if(!A || !B) return;
    svgLine(toVX(A.x),toVY(A.y),toVX(B.x),toVY(B.y),"#f8f5ec",3,null);
  });
}
function drawPath(path){
  clearOverlay();
  for(let i=0;i<path.length-1;i++){
    const A=vertexPos(path[i]), B=vertexPos(path[i+1]);
    svgLine(toVX(A.x),toVY(A.y),toVX(B.x),toVY(B.y),"#b9925a",6,null);
  }
}

function render(){
  document.querySelectorAll(".node").forEach(d=>d.classList.remove("active","endpoint"));
  const from = fromSel.value, to = toSel.value;
  if(poiDotEls[from]) poiDotEls[from].classList.add("endpoint");
  if(poiDotEls[to]) poiDotEls[to].classList.add("endpoint");
}

function runRoute(){
  const from = fromSel.value, to = toSel.value; const t = I18N[lang];
  if(from === to){ resultEl.textContent = t.sameNode; clearOverlay(); render(); lastRoute=null; return; }
  const res = shortestPath(from, to);
  if(!res){ resultEl.textContent = t.noPath; clearOverlay(); lastRoute=null; return; }
  lastRoute = res;
  drawPath(res.path);
  document.querySelectorAll(".node").forEach(d=>d.classList.remove("active"));
  res.path.forEach(id=>{ if(poiDotEls[id]) poiDotEls[id].classList.add("active"); });
  if(poiDotEls[from]) poiDotEls[from].classList.add("endpoint");
  if(poiDotEls[to]) poiDotEls[to].classList.add("endpoint");
  showRouteText();
}
function showRouteText(){
  if(!lastRoute) return; const t = I18N[lang];
  const steps = lastRoute.path.filter(isPOI).map(id=>NODES[id][lang]).join(" → ");
  resultEl.innerHTML = `${t.distancePrefix} <b>${lastRoute.distance} m</b><br>${steps}`;
}

document.getElementById("goBtn").addEventListener("click", runRoute);
document.getElementById("swapBtn").addEventListener("click", ()=>{
  const a = fromSel.value; fromSel.value = toSel.value; toSel.value = a;
  render(); if(lastRoute) runRoute();
});
[fromSel,toSel].forEach(s=> s.addEventListener("change", ()=>{ render(); if(lastRoute) runRoute(); }));

function placeDot(x,y,isVirtual){
  if(gpsDotEl) gpsDotEl.remove();
  gpsDotEl = document.createElement("div");
  gpsDotEl.className = "gpsdot" + (isVirtual ? " virtual" : "");
  gpsDotEl.style.left = x+"%"; gpsDotEl.style.top = y+"%";
  mapinner.appendChild(gpsDotEl);
}
function applyPosition(x,y,isVirtual){
  const t = I18N[lang];
  if(!isVirtual && !isOnMap(x,y)){ stopLiveTracking(); setMode("virtual"); gpsNoteEl.textContent = t.offSite; return; }
  placeDot(x,y,isVirtual);
  const nodeId = nearestPOI(x,y);
  fromSel.value = nodeId;
  gpsNoteEl.textContent = isVirtual ? t.virtualMatched(NODES[nodeId][lang]) : t.liveMatched(NODES[nodeId][lang]);
  render(); runRoute();
}

/* ============ 6. GPS ============ */
function startLiveTracking(){
  const t = I18N[lang];
  if(!navigator.geolocation){ gpsNoteEl.textContent = t.gpsUnsupported; return; }
  gpsNoteEl.textContent = t.gpsSearching;
  watchId = navigator.geolocation.watchPosition(pos=>{
    const {latitude, longitude} = pos.coords;
    const xy = gpsToXY(latitude, longitude);
    applyPosition(xy.x, xy.y, false);
  }, ()=>{ gpsNoteEl.textContent = I18N[lang].gpsError; },
  { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
  liveTracking = true; gpsBtn.classList.add("tracking"); gpsBtn.textContent = t.liveStop;
}
function stopLiveTracking(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  liveTracking = false; gpsBtn.classList.remove("tracking"); gpsBtn.textContent = I18N[lang].liveStart;
}
gpsBtn.addEventListener("click", ()=>{
  if(mode !== "real") return;
  if(liveTracking) stopLiveTracking(); else startLiveTracking();
});

/* ============ 7. Chế độ real / virtual (khách) ============ */
function setMode(m){
  mode = m;
  document.getElementById("btnReal").classList.toggle("active", mode==="real");
  document.getElementById("btnReal").classList.toggle("real", mode==="real");
  document.getElementById("btnVirtual").classList.toggle("active", mode==="virtual");
  document.getElementById("btnVirtual").classList.toggle("virtual", mode==="virtual");
  gpsBtn.style.display = mode === "real" ? "block" : "none";
  virtualHintEl.style.display = mode === "virtual" ? "block" : "none";
  if(mode === "virtual") stopLiveTracking();
  updateCursor();
}
document.getElementById("modeswitch").addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-mode]"); if(!btn) return;
  setMode(btn.dataset.mode); applyLang();
});

/* ============ 8. Zoom ============ */
let zoom = 1;
function applyZoom(){ mapinner.style.width = (1000*zoom)+"px"; }
function fitZoom(){
  const cw = mapwrap.clientWidth - 4;
  zoom = Math.max(0.28, Math.min(1.4, cw/1000));
  applyZoom();
  mapwrap.scrollTo(0,0);
}
document.getElementById("zoomInBtn").addEventListener("click", ()=>{ zoom = Math.min(2.5, zoom+0.2); applyZoom(); });
document.getElementById("zoomOutBtn").addEventListener("click", ()=>{ zoom = Math.max(0.2, zoom-0.2); applyZoom(); });
document.getElementById("zoomFitBtn").addEventListener("click", fitZoom);
window.addEventListener("resize", fitZoom);

/* ============ 9. Toạ độ click/chạm ============ */
function pointerToPercent(e){
  const rect = mapimg.getBoundingClientRect();
  return { x: (e.clientX-rect.left)/rect.width*100, y: (e.clientY-rect.top)/rect.height*100 };
}
function updateCursor(){
  mapinner.classList.toggle("pickmode", mode === "virtual" && !adminMode);
  mapinner.classList.toggle("drawmode", adminMode === "chain" || adminMode === "connect" || adminMode === "delete");
  mapinner.classList.toggle("movemode", adminMode === "move");
}

/* ============ 10. Công cụ quản trị: sơ đồ đường đi (khung đồ thị) ============ */
const VERTEX_HIT_PERCENT = 2.8;
const EDGE_HIT_PERCENT = 1.3;
let adminMode = null; // null | "chain" | "move" | "connect" | "delete"
let junctionSeq = 0;
let chainLast = null;
let connectPick = null;
let dragId = null, dragMoved = false;
let undoStack = [];
const junctionDotEls = {};

function newJunctionId(){ junctionSeq++; return "j"+junctionSeq; }

function hitTestVertex(x,y,threshold,onlyJunctions){
  let best=null,bestD=Infinity;
  if(!onlyJunctions){
    Object.keys(NODES).forEach(id=>{
      const p=vertexPos(id); const d=Math.hypot(p.x-x,p.y-y);
      if(d<bestD){bestD=d;best=id;}
    });
  }
  Object.keys(JUNCTIONS).forEach(id=>{
    const p=JUNCTIONS[id]; const d=Math.hypot(p.x-x,p.y-y);
    if(d<bestD){bestD=d;best=id;}
  });
  return bestD<=threshold ? best : null;
}
function pointSegDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
  let t = len2===0?0:((px-ax)*dx+(py-ay)*dy)/len2;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function nearestEdgeIndex(x,y){
  let best=null,bestD=Infinity;
  GRAPH_EDGES.forEach((e,i)=>{
    const A=vertexPos(e[0]), B=vertexPos(e[1]);
    if(!A||!B) return;
    const d=pointSegDist(x,y,A.x,A.y,B.x,B.y);
    if(d<bestD){bestD=d;best=i;}
  });
  return bestD<=EDGE_HIT_PERCENT ? best : null;
}

function snapshotPush(){
  undoStack.push(JSON.stringify({JUNCTIONS, NODE_OVERRIDES, GRAPH_EDGES, junctionSeq}));
  if(undoStack.length>60) undoStack.shift();
}
function saveGraph(){
  localStorage.setItem("resortGraphV2", JSON.stringify({JUNCTIONS, NODE_OVERRIDES, GRAPH_EDGES, junctionSeq}));
}
function loadGraph(){
  try{
    const raw = JSON.parse(localStorage.getItem("resortGraphV2") || "null");
    if(raw){
      Object.assign(JUNCTIONS, raw.JUNCTIONS||{});
      Object.assign(NODE_OVERRIDES, raw.NODE_OVERRIDES||{});
      GRAPH_EDGES.push(...(raw.GRAPH_EDGES||[]));
      junctionSeq = raw.junctionSeq||0;
    }
  }catch(e){}
}

function createJunctionDot(id){
  const dot = document.createElement("div");
  dot.className = "junction"; dot.id = "j-"+id;
  const p = JUNCTIONS[id];
  dot.style.left = p.x+"%"; dot.style.top = p.y+"%";
  mapinner.appendChild(dot);
  junctionDotEls[id] = dot;
}
function rebuildJunctionDots(){
  Object.values(junctionDotEls).forEach(el=>el.remove());
  Object.keys(junctionDotEls).forEach(k=>delete junctionDotEls[k]);
  if(!isAdmin) return;
  Object.keys(JUNCTIONS).forEach(createJunctionDot);
}
function updateVertexDotPos(id){
  const p = vertexPos(id);
  if(poiDotEls[id]){ poiDotEls[id].style.left=p.x+"%"; poiDotEls[id].style.top=p.y+"%"; }
  if(junctionDotEls[id]){ junctionDotEls[id].style.left=p.x+"%"; junctionDotEls[id].style.top=p.y+"%"; }
}

function redrawAdminView(){
  clearOverlay();
  if(isAdmin && adminPanel.classList.contains("open")) drawBaseNetwork();
  else if(lastRoute) drawPath(lastRoute.path);
}

function setAdminMode(m){
  adminMode = m; chainLast = null; connectPick = null;
  document.querySelectorAll("#adminModeSwitch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.amode === m);
  });
  document.querySelectorAll(".node.selected,.junction.selected").forEach(el=>el.classList.remove("selected"));
  const t = I18N[lang];
  adminNoteEl.textContent = m==="chain" ? t.noteChain : m==="move" ? t.noteMove : m==="connect" ? t.noteConnect : t.noteDelete;
  updateCursor();
}
document.getElementById("adminModeSwitch").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-amode]"); if(!btn) return;
  setAdminMode(btn.dataset.amode);
});
document.getElementById("adminToggleBtn").addEventListener("click", ()=>{
  adminPanel.classList.toggle("open");
  if(adminPanel.classList.contains("open") && !adminMode) setAdminMode("chain");
  redrawAdminView();
});
document.getElementById("breakChainBtn").addEventListener("click", ()=>{
  chainLast = null;
  document.querySelectorAll(".node.selected,.junction.selected").forEach(el=>el.classList.remove("selected"));
});
document.getElementById("undoBtn").addEventListener("click", ()=>{
  if(!undoStack.length){ adminNoteEl.textContent = I18N[lang].nothingToUndo; return; }
  const snap = JSON.parse(undoStack.pop());
  Object.keys(JUNCTIONS).forEach(k=>delete JUNCTIONS[k]); Object.assign(JUNCTIONS, snap.JUNCTIONS);
  Object.keys(NODE_OVERRIDES).forEach(k=>delete NODE_OVERRIDES[k]); Object.assign(NODE_OVERRIDES, snap.NODE_OVERRIDES);
  GRAPH_EDGES.length = 0; GRAPH_EDGES.push(...snap.GRAPH_EDGES);
  junctionSeq = snap.junctionSeq;
  saveGraph(); rebuildGraph(); rebuildJunctionDots();
  Object.keys(NODES).forEach(updateVertexDotPos);
  chainLast = null; connectPick = null;
  redrawAdminView();
});
document.getElementById("clearAllBtn").addEventListener("click", ()=>{
  if(!confirm(I18N[lang].confirmClearAll)) return;
  snapshotPush();
  Object.keys(JUNCTIONS).forEach(k=>delete JUNCTIONS[k]);
  Object.keys(NODE_OVERRIDES).forEach(k=>delete NODE_OVERRIDES[k]);
  GRAPH_EDGES.length = 0; junctionSeq = 0;
  saveGraph(); rebuildGraph(); rebuildJunctionDots();
  Object.keys(NODES).forEach(updateVertexDotPos);
  chainLast = null; connectPick = null;
  adminNoteEl.textContent = I18N[lang].clearedAll;
  lastRoute = null; resultEl.textContent = "";
  redrawAdminView();
});
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const code = "const JUNCTIONS = " + JSON.stringify(JUNCTIONS, null, 2) + ";\n\n" +
               "const NODE_OVERRIDES = " + JSON.stringify(NODE_OVERRIDES, null, 2) + ";\n\n" +
               "const GRAPH_EDGES = " + JSON.stringify(GRAPH_EDGES, null, 2) + ";";
  codeOut.value = code; codeOut.style.display = "block"; codeOut.select();
  adminNoteEl.textContent = I18N[lang].exportedNote;
});

/* --- Vẽ chuỗi (chain) --- */
function handleChainTap(x,y){
  const hit = hitTestVertex(x,y,VERTEX_HIT_PERCENT);
  snapshotPush();
  let thisId;
  if(hit){ thisId = hit; }
  else { thisId = newJunctionId(); JUNCTIONS[thisId] = {x,y}; createJunctionDot(thisId); }
  if(chainLast && chainLast !== thisId){ GRAPH_EDGES.push([chainLast, thisId]); }
  chainLast = thisId;
  saveGraph(); rebuildGraph(); redrawAdminView();
}
/* --- Nối 2 điểm (connect) --- */
function handleConnectTap(x,y){
  const hit = hitTestVertex(x,y,VERTEX_HIT_PERCENT);
  if(!hit) return;
  document.querySelectorAll(".node.selected,.junction.selected").forEach(el=>el.classList.remove("selected"));
  if(!connectPick){
    connectPick = hit;
    const el = poiDotEls[hit] || junctionDotEls[hit];
    if(el) el.classList.add("selected");
    adminNoteEl.textContent = I18N[lang].noteConnectPicked(vertexLabel(hit) || hit);
    return;
  }
  if(hit !== connectPick){
    snapshotPush();
    GRAPH_EDGES.push([connectPick, hit]);
    saveGraph(); rebuildGraph(); redrawAdminView();
  }
  connectPick = null;
  adminNoteEl.textContent = I18N[lang].noteConnect;
}
/* --- Xóa (delete) --- */
function handleDeleteTap(x,y){
  const hitJ = hitTestVertex(x,y,VERTEX_HIT_PERCENT,true);
  snapshotPush();
  if(hitJ){
    delete JUNCTIONS[hitJ];
    for(let i=GRAPH_EDGES.length-1;i>=0;i--){ if(GRAPH_EDGES[i].includes(hitJ)) GRAPH_EDGES.splice(i,1); }
    if(junctionDotEls[hitJ]){ junctionDotEls[hitJ].remove(); delete junctionDotEls[hitJ]; }
  } else {
    const ei = nearestEdgeIndex(x,y);
    if(ei !== null) GRAPH_EDGES.splice(ei,1);
    else { undoStack.pop(); return; }
  }
  saveGraph(); rebuildGraph(); redrawAdminView();
}

/* --- Di chuyển (move/drag) — dùng Pointer Events --- */
mapinner.addEventListener("pointerdown",(e)=>{
  if(!isAdmin || adminMode !== "move") return;
  const p = pointerToPercent(e);
  const hit = hitTestVertex(p.x,p.y,VERTEX_HIT_PERCENT);
  if(!hit) return;
  snapshotPush();
  dragId = hit; dragMoved = false;
  mapinner.setPointerCapture(e.pointerId);
  e.preventDefault();
});
mapinner.addEventListener("pointermove",(e)=>{
  if(!dragId) return;
  dragMoved = true;
  const p = pointerToPercent(e);
  if(JUNCTIONS[dragId]) JUNCTIONS[dragId] = {x:p.x,y:p.y};
  else NODE_OVERRIDES[dragId] = {x:p.x,y:p.y};
  updateVertexDotPos(dragId);
  redrawAdminView();
});
function endDrag(){
  if(!dragId){ return; }
  if(dragMoved){ saveGraph(); rebuildGraph(); }
  else { undoStack.pop(); } // không di chuyển thật sự thì bỏ snapshot thừa
  dragId = null;
}
mapinner.addEventListener("pointerup", endDrag);
mapinner.addEventListener("pointercancel", endDrag);

/* --- Click chung: định tuyến theo adminMode, hoặc GPS ảo cho khách --- */
mapinner.addEventListener("click", (e)=>{
  if(dragMoved){ dragMoved=false; return; } // vừa kéo xong thì bỏ qua click ăn theo
  const p = pointerToPercent(e);
  if(isAdmin && adminMode === "chain"){ handleChainTap(p.x,p.y); return; }
  if(isAdmin && adminMode === "connect"){ handleConnectTap(p.x,p.y); return; }
  if(isAdmin && adminMode === "delete"){ handleDeleteTap(p.x,p.y); return; }
  if(isAdmin && adminMode === "move"){ return; }
  if(mode === "virtual"){ applyPosition(p.x,p.y,true); }
});

/* ============ 11. Ngôn ngữ + bản đồ theo ngôn ngữ ============ */
function applyLang(){
  const t = I18N[lang];
  document.getElementById("hTitle").textContent = t.title;
  document.getElementById("hSubtitle").textContent = t.subtitle;
  document.getElementById("lblFrom").textContent = t.fromLabel;
  document.getElementById("lblTo").textContent = t.toLabel;
  document.getElementById("goBtn").textContent = t.goBtn;
  document.getElementById("hint").textContent = t.hint;
  document.getElementById("footerText").textContent = t.footer;
  document.getElementById("lblMode").textContent = t.modeLbl;
  document.getElementById("btnReal").textContent = t.modeReal;
  document.getElementById("btnVirtual").textContent = t.modeVirtual;
  gpsBtn.textContent = liveTracking ? t.liveStop : t.liveStart;
  virtualHintEl.textContent = t.virtualHintText;
  document.getElementById("adminToggleBtn").textContent = t.adminToggle;
  document.getElementById("adminTitle").textContent = t.adminTitle;
  document.getElementById("amChain").textContent = t.amChain;
  document.getElementById("amMove").textContent = t.amMove;
  document.getElementById("amConnect").textContent = t.amConnect;
  document.getElementById("amDelete").textContent = t.amDelete;
  document.getElementById("breakChainBtn").textContent = t.breakChain;
  document.getElementById("undoBtn").textContent = t.undoBtn;
  document.getElementById("clearAllBtn").textContent = t.clearAllBtn;
  document.getElementById("exportBtn").textContent = t.exportBtn;
  document.getElementById("btnVi").classList.toggle("active", lang==="vi");
  document.getElementById("btnEn").classList.toggle("active", lang==="en");
  document.documentElement.lang = lang;
  mapimg.src = lang === "en" ? "map_en.jpg" : "map.jpg";
  buildOptions(fromSel, fromSel.value || "lobby");
  buildOptions(toSel, toSel.value || "pool");
  Object.entries(NODES).forEach(([id,n])=>{ if(poiDotEls[id]) poiDotEls[id].title = n[lang]; });
  render();
  if(lastRoute) showRouteText();
  if(adminMode) setAdminMode(adminMode);
}
document.getElementById("langswitch").addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-lang]"); if(!btn) return;
  lang = btn.dataset.lang; applyLang();
});

/* ============ init ============ */
loadGraph();
rebuildGraph();
rebuildJunctionDots();
Object.keys(NODES).forEach(updateVertexDotPos);
if(isAdmin){ document.getElementById("adminToggleBtn").style.display = "block"; }
setMode("real");
applyLang();
clearOverlay();
mapimg.addEventListener("load", fitZoom);
fitZoom();
</script>
